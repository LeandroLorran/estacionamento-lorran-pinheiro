<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Senac Parking</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jockey+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="pagina">
      <div class="imagem">
        <img
          src="Teste-senac2/Imagem/Professional parking facility background.png"
        />

        <div class="status">
          <div class="status-header">
            <img src="Teste-senac2/Imagem/Icon-carro-azul.svg" alt="Carro" />
            <h3>Status em Tempo Real</h3>
          </div>

          <p>
            O sistema Papaléo Parking otimiza o fluxo de entrada e saída,
            garantindo segurança e agilidade para o Senac CEP.
          </p>
        </div>
      </div>

      <div class="login">
        <img
          src="Teste-senac2/Imagem/Senac Parking Management Logo.svg"
          alt=""
        />

        <h1>Senac CEP Papaléo</h1>

        <p>Gestão de Estacionamento</p>

        <div>
          <label>CPF ou CNH</label>
          <input type="text" id="usuario" placeholder="000.000.000-00" />

          <label>Senha</label>
          <input type="password" id="senha" placeholder="••••••••" />
        </div>

        <div class="lembrar">
          <input type="checkbox" />
          <span>Lembrar neste dispositivo</span>
        </div>

        <button onclick="entrar()">Entrar</button>
        <p id="mensagem"></p>
        <small>Todos os direitos reservados.</small>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
