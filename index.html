<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Senac Parking</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <div class="pagina">
      <!-- Painel da Imagem -->
      <div class="imagem">
        <img
          src="Teste-senac2/Imagem/Professional parking facility background.png"
        />

        <div class="status">
          <div class="status-header">
            <img src="Teste-senac2/Imagem/Icon-carro.svg" alt="Carro" />
            <h3>Status em Tempo Real</h3>
          </div>

          <p>
            O sistema Papaléo Parking otimiza o fluxo de entrada e saída,
            garantindo segurança e agilidade.
          </p>
        </div>
      </div>

      <!-- Painel de Login -->
      <div class="login">
        <h1>Senac CEP Papaléo</h1>

        <p>Gestão de Estacionamento</p>

        <label>CPF ou CNH</label>
        <input type="text"  id="usuario" placeholder="000.000.000-00" />

        <label>Senha</label>
        <input type="password" id="senha" placeholder="••••••••" />

        <div class="lembrar">
          <input type="checkbox" />
          <span>Lembrar neste dispositivo</span>
        </div>

        <button onclick="entrar()">Entrar</button>
        <p id="mensagem"></p>
        <small>Todos os direitos reservados.</small>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
